<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#07091a;font-family:Inter,-apple-system,"Segoe UI",sans-serif;color:#eef1ff;position:relative}
.g1,.g2{position:absolute;border-radius:50%;filter:blur(110px)}
.g1{width:600px;height:600px;background:#6d4aff;opacity:.5;left:-150px;top:-200px}
.g2{width:560px;height:560px;background:#00c2ff;opacity:.35;right:-100px;bottom:-250px}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(90deg,#000,transparent 80%);-webkit-mask-image:linear-gradient(90deg,#000,transparent 80%)}
.t{position:absolute;left:70px;top:150px;width:500px}
.pill{display:inline-flex;gap:8px;align-items:center;padding:8px 16px;border:1px solid rgba(255,255,255,.15);border-radius:99px;font-size:18px;color:#b5bde0;background:rgba(255,255,255,.05)}
.pill i{width:10px;height:10px;border-radius:50%;background:#34e0a1;box-shadow:0 0 12px #34e0a1}
h1{font-size:68px;line-height:1.02;letter-spacing:-.035em;margin:26px 0 20px}
h1 em{font-style:normal;background:linear-gradient(90deg,#a78bfa,#38bdf8,#34e0a1);-webkit-background-clip:text;background-clip:text;color:transparent}
p{font-size:22px;color:#8d96bd;line-height:1.4}
.w{position:absolute;width:440px;height:290px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.18);background:#fff;box-shadow:0 30px 70px rgba(0,0,0,.55)}
.w .b{height:26px;background:#1b2040;display:flex;gap:6px;align-items:center;padding:0 12px}
.w .b i{width:9px;height:9px;border-radius:50%;background:#ff5f57}.w .b i:nth-child(2){background:#febc2e}.w .b i:nth-child(3){background:#28c840}
.w img{width:100%;height:264px;object-fit:cover;object-position:top;display:block}
.a{right:250px;top:40px;transform:rotate(-5deg)}
.b2{right:-60px;top:140px;transform:rotate(4deg)}
.c{right:130px;top:340px;transform:rotate(-2deg)}
</style></head><body><div class="g1"></div><div class="g2"></div><div class="grid"></div>
<div class="w a"><div class="b"><i></i><i></i><i></i></div><img src="../img/1102-fin-demo.png"></div>
<div class="w b2"><div class="b"><i></i><i></i><i></i></div><img src="../img/ai-zone-demo.png"></div>
<div class="w c"><div class="b"><i></i><i></i><i></i></div><img src="../img/design-system-demo.png"></div>
<div class="t"><span class="pill"><i></i>5 live demos</span><h1>Ningdan's <em>AI Demo Lab</em></h1><p>Intelligent self-service and agent-powered help experiences.</p></div>
</body></html>
